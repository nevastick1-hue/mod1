plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.24' }

group='com.nevastick'
version='1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

minecraft { mappings channel: 'official', version: '1.20.1' }

repositories { mavenCentral(); maven { url='https://maven.minecraftforge.net' } }

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }

tasks.named('jar', Jar).configure { archiveBaseName='tooltip-area-patch'; manifest { attributes(['Specification-Title':'tooltip-area-patch','Implementation-Version':project.version]) } }
