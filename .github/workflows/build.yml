name: Build Patched Tooltip Overhaul

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch
        uses: actions/checkout@v4
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: Xylonity/Tooltip-Overhaul
          ref: 1.20.1-4/rewrite
          path: upstream
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply patch
        run: python3 scripts/apply_patch.py
      - name: Build
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :forge:build --stacktrace --info --no-daemon
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp upstream/forge/build/libs/*.jar artifact/ || true
          rm -f artifact/*-sources.jar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-tooltip-overhaul
          path: artifact/*.jar
          if-no-files-found: error
